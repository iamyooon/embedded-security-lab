<text x="265.0" y="586.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#555" font-weight="normal" text-anchor="middle" xml:space="preserve">검증</text>
<rect x="290" y="546" width="250" height="175" rx="8" fill="#e8f0fb" stroke="#3b6fb6" stroke-width="2.5"/>
<text x="302" y="572" font-family="NanumGothic, sans-serif" font-size="17" fill="#3b6fb6" font-weight="bold" text-anchor="start" xml:space="preserve">BL2</text>
<text x="302" y="598" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">tb_fw.crt 로 검증됨</text>
<text x="302" y="621" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(루트 키)</text>
<line x1="540" y1="626" x2="600" y2="626" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="570.0" y="586.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#555" font-weight="normal" text-anchor="middle" xml:space="preserve">검증</text>
<rect x="600" y="546" width="330" height="175" rx="8" fill="#e8f0fb" stroke="#3b6fb6" stroke-width="2.5"/>
<text x="612" y="572" font-family="NanumGothic, sans-serif" font-size="17" fill="#3b6fb6" font-weight="bold" text-anchor="start" xml:space="preserve">BL2 가 BL33 검증</text>
<text x="612" y="598" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">trusted_key.crt   (루트 키 서명)</text>
<text x="612" y="621" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve"> -&gt; nt_fw_key.crt  (NT world 키)</text>
<text x="612" y="644" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve"> -&gt; nt_fw_content.crt</text>
<text x="612" y="667" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">     = hash(bl33.bin)</text>
<text x="612" y="690" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(BL31/BL32 도 같은 식, 생략)</text>
<line x1="930" y1="626" x2="990" y2="626" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="960.0" y="586.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#555" font-weight="normal" text-anchor="middle" xml:space="preserve">검증</text>
<rect x="990" y="546" width="360" height="175" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="2.5"/>
<text x="1002" y="572" font-family="NanumGothic, sans-serif" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="start" xml:space="preserve">BL33 = u-boot.bin</text>
<text x="1002" y="598" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">u-boot-nodtb.bin (코드)</text>
<text x="1002" y="621" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">+ u-boot.dtb  &lt;- 빌드 때 붙임</text>
<text x="1002" y="644" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">    /signature/key-fit</text>
<text x="1002" y="667" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">      FIT 공개키 (mkimage -K)</text>
<text x="1002" y="690" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">bl33 해시가 공개키까지 덮음</text>
<line x1="1350" y1="626" x2="1410" y2="626" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="1380.0" y="586.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#555" font-weight="normal" text-anchor="middle" xml:space="preserve">검증</text>
<rect x="1410" y="546" width="460" height="175" rx="8" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/>
<text x="1422" y="572" font-family="NanumGothic, sans-serif" font-size="17" fill="#c77700" font-weight="bold" text-anchor="start" xml:space="preserve">kernel.itb (FIT)</text>
<text x="1422" y="598" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">/images/kernel-1  data + hash</text>
<text x="1422" y="621" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">/images/fdt-1     data + hash</text>
<text x="1422" y="644" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">/images/ramdisk-1 data + hash</text>
<text x="1422" y="667" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">/configurations/conf-1 + signature</text>
<text x="1422" y="690" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">bootm: 서명 -&gt; 각 이미지 해시</text>
<rect x="30" y="760" width="900" height="340" rx="8" fill="#f4ecfb" stroke="#7d4cad" stroke-width="2.5"/>
<text x="42" y="786" font-family="NanumGothic, sans-serif" font-size="17" fill="#7d4cad" font-weight="bold" text-anchor="start" xml:space="preserve">키 3 종류 -- 누가 무엇을 서명/검증하나</text>
<text x="50" y="826" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">키</text>
<text x="220" y="826" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">비밀키 (서명, 개발사/HSM)</text>
<text x="530" y="826" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">공개키를 믿는 근거</text>
<text x="50" y="866" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">루트 키</text>
<text x="220" y="866" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">tb_fw.crt, trusted_key.crt</text>
<text x="530" y="866" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">OTP 의 ROTPK 해시 (못 바꿈)</text>
<text x="50" y="906" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">NT world 키</text>
<text x="220" y="906" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">nt_fw_key/content.crt</text>
<text x="530" y="906" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">trusted_key.crt 안 (루트 키가 보증)</text>
<text x="50" y="946" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">FIT 키 (새로)</text>
<text x="220" y="946" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">kernel.itb 의 conf 서명</text>
<text x="530" y="946" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">u-boot.dtb 안 (bl33 해시가 보증)</text>
<text x="50" y="1010" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">FIT 키를 루트 키와 나누는 이유: 커널은 자주 서명 -&gt; 유출 기회 많음.</text>
<text x="50" y="1036" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">FIT 키가 새도 펌웨어 체인은 안전, 새 공개키를 넣은 U-Boot 로 교체하면 복구.</text>
<text x="50" y="1062" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">단 옛 U-Boot 로 롤백하면 옛 키가 살아남 -&gt; NV 카운터 필요 (위협모델 '못 막는 것').</text>
<rect x="970" y="760" width="900" height="340" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="2.5"/>
<text x="982" y="786" font-family="NanumGothic, sans-serif" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="start" xml:space="preserve">목표로 가려면 (해야 할 일)</text>
<text x="982" y="812" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(1) FIT 키쌍 생성 (openssl, RSA-2048)</text>
<text x="982" y="835" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(2) kernel.its 작성: kernel + fdt + ramdisk, conf 에 signature</text>
<text x="982" y="858" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(3) mkimage -f kernel.its -k &lt;키dir&gt; -K u-boot.dtb -r kernel.itb</text>
<text x="982" y="881" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">     -&gt; itb 에 서명, u-boot.dtb 에 공개키 기록 (required = conf)</text>
<text x="982" y="904" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(4) U-Boot: OF_BOARD 끄고 u-boot.dtb 를 u-boot.bin 에 붙여 빌드</text>
