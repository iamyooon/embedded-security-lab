<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1130" viewBox="0 0 1900 1130">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="1900" height="1130" fill="#fff"/>
<text x="30" y="44" font-family="NanumGothic, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">Secure Boot 전체 신뢰 체인 -- TF-A TBB + U-Boot FIT verified boot</text>
<text x="30" y="74" font-family="NanumGothic, sans-serif" font-size="17" fill="#555555" font-weight="normal" text-anchor="start" xml:space="preserve">각 단계는 다음 단계를 검증하고 나서 넘겨준다. 한 칸이라도 검증 없이 넘어가면 그 뒤는 전부 못 믿는다.</text>
<text x="30" y="122" font-family="NanumGothic, sans-serif" font-size="21" fill="#c0392b" font-weight="bold" text-anchor="start" xml:space="preserve">지금 (2026-11-18 빌드)</text>
<rect x="30" y="140" width="210" height="175" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="42" y="166" font-family="NanumGothic, sans-serif" font-size="17" fill="#666666" font-weight="bold" text-anchor="start" xml:space="preserve">BL1 + OTP</text>
<text x="42" y="192" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">Mask ROM (못 바꿈)</text>
<text x="42" y="215" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">OTP: ROTPK 해시</text>
<text x="42" y="238" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve"></text>
<text x="42" y="261" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">[A][B][C] 로 확인</text>
<line x1="240" y1="220" x2="290" y2="220" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="265.0" y="180.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#555" font-weight="normal" text-anchor="middle" xml:space="preserve">검증</text>
<rect x="290" y="140" width="250" height="175" rx="8" fill="#e8f0fb" stroke="#3b6fb6" stroke-width="2.5"/>
<text x="302" y="166" font-family="NanumGothic, sans-serif" font-size="17" fill="#3b6fb6" font-weight="bold" text-anchor="start" xml:space="preserve">BL2</text>
<text x="302" y="192" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">tb_fw.crt 로 검증됨</text>
<text x="302" y="215" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(루트 키)</text>
<line x1="540" y1="220" x2="600" y2="220" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="570.0" y="180.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#555" font-weight="normal" text-anchor="middle" xml:space="preserve">검증</text>
<rect x="600" y="140" width="330" height="175" rx="8" fill="#e8f0fb" stroke="#3b6fb6" stroke-width="2.5"/>
<text x="612" y="166" font-family="NanumGothic, sans-serif" font-size="17" fill="#3b6fb6" font-weight="bold" text-anchor="start" xml:space="preserve">BL2 가 BL33 검증</text>
<text x="612" y="192" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">trusted_key.crt   (루트 키 서명)</text>
<text x="612" y="215" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve"> -&gt; nt_fw_key.crt  (NT world 키)</text>
<text x="612" y="238" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve"> -&gt; nt_fw_content.crt</text>
<text x="612" y="261" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">     = hash(bl33.bin)</text>
<text x="612" y="284" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(BL31/BL32 도 같은 식, 생략)</text>
<line x1="930" y1="220" x2="990" y2="220" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="960.0" y="180.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#555" font-weight="normal" text-anchor="middle" xml:space="preserve">검증</text>
<rect x="990" y="140" width="360" height="175" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="2.5"/>
<text x="1002" y="166" font-family="NanumGothic, sans-serif" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="start" xml:space="preserve">BL33 = u-boot.bin</text>
<text x="1002" y="192" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">u-boot-nodtb.bin (코드) 만</text>
<text x="1002" y="215" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">u-boot.bin == u-boot-nodtb.bin</text>
<text x="1002" y="238" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(확인함, cmp 동일)</text>
<text x="1002" y="261" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">DTB 는 안에 없음</text>
<rect x="990" y="355" width="360" height="100" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="1002" y="381" font-family="NanumGothic, sans-serif" font-size="17" fill="#c0392b" font-weight="bold" text-anchor="start" xml:space="preserve">DTB: QEMU 가 RAM 에 만들어 줌</text>
<text x="1002" y="407" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">CONFIG_OF_BOARD=y</text>
<text x="1002" y="430" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">board_fdt_blob_setup() 이 그대로 씀 -&gt; 검증 안 됨</text>
<line x1="1170" y1="355" x2="1170" y2="317" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="7,5"/>
<line x1="1350" y1="220" x2="1410" y2="220" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="7,5"/>
<text x="1380.0" y="180.0" font-family="NanumGothic, sans-serif" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="middle" xml:space="preserve">없음</text>
<rect x="1410" y="140" width="460" height="175" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="1422" y="166" font-family="NanumGothic, sans-serif" font-size="17" fill="#c0392b" font-weight="bold" text-anchor="start" xml:space="preserve">uImage (legacy) + rootfs</text>
<text x="1422" y="192" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">load hostfs - ... uImage</text>
<text x="1422" y="215" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">bootm ${kernel_addr_r} ...</text>
<text x="1422" y="238" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve"></text>
<text x="1422" y="261" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">커널은 체인 밖 -- 바꿔도 부팅됨</text>
<text x="1422" y="284" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">(위협모델 자산인데 비어 있음)</text>
<line x1="30" y1="485" x2="1870" y2="485" stroke="#ccc" stroke-width="2"/>
<text x="30" y="528" font-family="NanumGothic, sans-serif" font-size="21" fill="#2e8b57" font-weight="bold" text-anchor="start" xml:space="preserve">목표 (FIT verified boot 적용 후)</text>
<rect x="30" y="546" width="210" height="175" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2.5"/>
<text x="42" y="572" font-family="NanumGothic, sans-serif" font-size="17" fill="#666666" font-weight="bold" text-anchor="start" xml:space="preserve">BL1 + OTP</text>
<text x="42" y="598" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">Mask ROM (못 바꿈)</text>
<text x="42" y="621" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">OTP: ROTPK 해시</text>
