<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1010" viewBox="0 0 1640 1010">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
<rect width="1640" height="1010" fill="#ffffff"/>
<text x="40" y="46" font-family="NanumGothic, sans-serif" font-size="26" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">[C] 공개키 교체 -- 공격자 키로 인증서를 통째로 새로 만듦</text>
<text x="40" y="78" font-family="NanumGothic, sans-serif" font-size="18" fill="#555555" font-weight="normal" text-anchor="start" xml:space="preserve">공격자: 내 키쌍 + 변조 bl2 해시 + 내 비밀키 서명 (cert_create)</text>
<rect x="40" y="100" width="520" height="520" rx="8" fill="#e8f0fb" stroke="#3b6fb6" stroke-width="2"/>
<text x="56" y="128" font-family="NanumGothic, sans-serif" font-size="17" fill="#3b6fb6" font-weight="bold" text-anchor="start" xml:space="preserve">플래시 / out/bin  (공격자가 바꿀 수 있음)</text>
<rect x="56" y="142" width="488" height="356" rx="6" fill="#f7faff" stroke="#3b6fb6" stroke-width="2"/>
<text x="70" y="168" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">tb_fw.crt  (id=6, BL2 용 인증서)</text>
<text x="70" y="192" font-family="NanumGothic, sans-serif" font-size="15" fill="#555555" font-weight="normal" text-anchor="start" xml:space="preserve">본문 (TBSCertificate)</text>
<rect x="80" y="202" width="440" height="58" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="92" y="226" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">루트 공개키</text>
<text x="92" y="248" font-family="NanumGothic, sans-serif" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="start" xml:space="preserve">공격자 공개키 (해시 f8d17b..)</text>
<rect x="80" y="268" width="440" height="58" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="92" y="292" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">bl2 해시</text>
<text x="92" y="314" font-family="NanumGothic, sans-serif" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="start" xml:space="preserve">변조된 bl2 의 해시</text>
<rect x="80" y="334" width="440" height="58" rx="5" fill="#ffffff" stroke="#3b6fb6" stroke-width="2"/>
<text x="92" y="358" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">NV 카운터</text>
<text x="92" y="380" font-family="NanumGothic, sans-serif" font-size="14" fill="#555555" font-weight="normal" text-anchor="start" xml:space="preserve">0</text>
<text x="70" y="420" font-family="NanumGothic, sans-serif" font-size="15" fill="#555555" font-weight="normal" text-anchor="start" xml:space="preserve">본문에 대한 서명</text>
<rect x="80" y="430" width="440" height="58" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="92" y="454" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">signatureValue (RSA-PSS 2048)</text>
<text x="92" y="476" font-family="NanumGothic, sans-serif" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="start" xml:space="preserve">공격자 비밀키로 서명</text>
<rect x="56" y="512" width="488" height="58" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="68" y="536" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">bl2.bin  (id=1)</text>
<text x="68" y="558" font-family="NanumGothic, sans-serif" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="start" xml:space="preserve">1바이트 뒤집음 (0x100)</text>
<text x="56" y="600" font-family="NanumGothic, sans-serif" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="start" xml:space="preserve">빨간 칸 = 이번 실험에서 공격자가 바꾼 것</text>
<rect x="640" y="96" width="300" height="96" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="656" y="122" font-family="NanumGothic, sans-serif" font-size="17" fill="#666666" font-weight="bold" text-anchor="start" xml:space="preserve">OTP / eFuse  (못 바꿈)</text>
<text x="656" y="150" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">ROTPK 해시 = e3cf97..</text>
<text x="656" y="176" font-family="NanumGothic, sans-serif" font-size="14" fill="#555555" font-weight="normal" text-anchor="start" xml:space="preserve">(QEMU 는 BL1 빌드에 박힘)</text>
<rect x="640" y="540" width="300" height="90" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="656" y="566" font-family="NanumGothic, sans-serif" font-size="17" fill="#666666" font-weight="bold" text-anchor="start" xml:space="preserve">BL1 (Mask ROM, 못 바꿈)</text>
<text x="656" y="592" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">검증 없이 신뢰하는 출발점.</text>
<text x="656" y="616" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">오른쪽 (1)-&gt;(3) 을 수행</text>
<text x="1020" y="128" font-family="NanumGothic, sans-serif" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">BL1 의 검증 순서 (load_auth_image_recursive)</text>
<rect x="1020" y="142" width="580" height="100" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="1036" y="170" font-family="NanumGothic, sans-serif" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="start" xml:space="preserve">(1) 공개키가 진짜 루트 키인가</text>
<text x="1584" y="170" font-family="NanumGothic, sans-serif" font-size="16" fill="#c0392b" font-weight="bold" text-anchor="end" xml:space="preserve">실패 -&gt; 정지</text>
<text x="1036" y="196" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">hash(본문.공개키) == OTP 의 ROTPK 해시 ?</text>
<text x="1036" y="222" font-family="NanumGothicCoding, monospace" font-size="14" fill="#555555" font-weight="normal" text-anchor="start" xml:space="preserve">auth_mod.c:267  crypto_mod_verify_hash</text>
<line x1="1310.0" y1="242" x2="1310.0" y2="262" stroke="#999" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1020" y="262" width="580" height="100" rx="8" fill="#fafafa" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="7,5"/>
<text x="1036" y="290" font-family="NanumGothic, sans-serif" font-size="17" fill="#999999" font-weight="bold" text-anchor="start" xml:space="preserve">(2) 본문을 루트 키 주인이 썼나</text>
<text x="1584" y="290" font-family="NanumGothic, sans-serif" font-size="16" fill="#bbbbbb" font-weight="bold" text-anchor="end" xml:space="preserve">실행 안 됨</text>
<text x="1036" y="316" font-family="NanumGothic, sans-serif" font-size="15" fill="#999999" font-weight="normal" text-anchor="start" xml:space="preserve">본문.공개키로 서명 검증 : hash(본문) 과 일치 ?</text>
<text x="1036" y="342" font-family="NanumGothicCoding, monospace" font-size="14" fill="#999999" font-weight="normal" text-anchor="start" xml:space="preserve">auth_mod.c:294  crypto_mod_verify_signature</text>
<line x1="1310.0" y1="362" x2="1310.0" y2="382" stroke="#999" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1020" y="382" width="580" height="100" rx="8" fill="#fafafa" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="7,5"/>
<text x="1036" y="410" font-family="NanumGothic, sans-serif" font-size="17" fill="#999999" font-weight="bold" text-anchor="start" xml:space="preserve">(3) bl2.bin 이 그 본문과 맞나</text>
<text x="1584" y="410" font-family="NanumGothic, sans-serif" font-size="16" fill="#bbbbbb" font-weight="bold" text-anchor="end" xml:space="preserve">실행 안 됨</text>
<text x="1036" y="436" font-family="NanumGothic, sans-serif" font-size="15" fill="#999999" font-weight="normal" text-anchor="start" xml:space="preserve">hash(bl2.bin) == 본문.bl2해시 ?</text>
<text x="1036" y="462" font-family="NanumGothicCoding, monospace" font-size="14" fill="#999999" font-weight="normal" text-anchor="start" xml:space="preserve">id=1 auth_hash   (bl2.bin 을 읽은 뒤)</text>
<line x1="1310.0" y1="482" x2="1310.0" y2="502" stroke="#999" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1020" y="502" width="580" height="70" rx="8" fill="#fafafa" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="7,5"/>
<text x="1036" y="530" font-family="NanumGothic, sans-serif" font-size="17" fill="#999999" font-weight="bold" text-anchor="start" xml:space="preserve">BL2 로 점프</text>
<text x="1584" y="530" font-family="NanumGothic, sans-serif" font-size="16" fill="#bbbbbb" font-weight="bold" text-anchor="end" xml:space="preserve">실행 안 됨</text>
<text x="1036" y="556" font-family="NanumGothic, sans-serif" font-size="15" fill="#999999" font-weight="normal" text-anchor="start" xml:space="preserve">셋 다 통과해야 실행</text>
