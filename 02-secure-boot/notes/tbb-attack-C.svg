<path d="M940,150 C980.0,150 980.0,165 1020,165" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<path d="M520,459 C770.0,459 770.0,300 1020,300" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<path d="M520,231 C770.0,231 770.0,316 1020,316" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<path d="M520,297 C770.0,297 770.0,420 1020,420" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<path d="M544,541 C782.0,541 782.0,440 1020,440" fill="none" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="650" width="1560" height="110" rx="8" fill="#fffdf3" stroke="#c9a227" stroke-width="2"/>
<text x="56" y="678" font-family="NanumGothic, sans-serif" font-size="17" fill="#8a6d00" font-weight="bold" text-anchor="start" xml:space="preserve">결과</text>
<text x="120" y="678" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">hash(공격자 공개키) f8d17b.. != OTP 의 ROTPK 해시 -&gt; (1) 실패.</text>
<text x="120" y="704" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">서명 검증(294줄)은 그 뒤라 가지도 않음. bl2 도 안 읽음.</text>
<text x="120" y="730" font-family="NanumGothic, sans-serif" font-size="16" fill="#1d1d1f" font-weight="normal" text-anchor="start" xml:space="preserve">-&gt; 실패 기준 2 통과. 막아 준 것 = 바꿀 수 없는 OTP 해시</text>
<rect x="40" y="780" width="1560" height="200" rx="8" fill="#1e1e1e" stroke="#1e1e1e" stroke-width="2"/>
<text x="56" y="806" font-family="NanumGothic, sans-serif" font-size="14" fill="#aaaaaa" font-weight="normal" text-anchor="start" xml:space="preserve">실제 로그 (앞의 BL1 공통 6줄 생략)  -- tamper-rotpk.log (LOG_LEVEL=50)</text>
