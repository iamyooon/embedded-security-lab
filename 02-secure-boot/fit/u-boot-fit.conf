# U-Boot FIT verified boot 용 Kconfig 조각 (build/kconfigs/u-boot_qemu_v8.conf 뒤에 merge).
#
# DTB 를 QEMU 가 RAM 에 주는 것(OF_BOARD) 대신 u-boot.bin 뒤에 붙인 것(OF_SEPARATE)을 쓴다.
# -> 그 DTB 의 /signature 노드(FIT 공개키)까지 TF-A 의 bl33 해시가 덮는다.
CONFIG_OF_SEPARATE=y
# CONFIG_OF_BOARD is not set
# CONFIG_OF_HAS_PRIOR_STAGE is not set

# 서명 검증
CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
CONFIG_RSA_VERIFY=y
# 서명 없는 legacy uImage 로 우회 부팅하는 길을 막는다
# CONFIG_LEGACY_IMAGE_FORMAT is not set

# 하드닝 [E] -- 공격자 능력에 "시리얼 콘솔 접근"을 넣은 뒤 (2026-11-18)
# 검증 실패 -> 셸 이 기본 동작이고, 셸에선 booti 로 무서명 커널이 뜬다(실험으로 확인).
#  - 실패하면 셸이 아니라 reset (";" 뒤 reset 은 앞이 실패해 돌아왔을 때만 실행)
CONFIG_BOOTCOMMAND="setenv loadaddr 0x50000000 && load hostfs - ${loadaddr} kernel.itb && setenv bootargs console=ttyAMA0,115200 earlyprintk=serial,ttyAMA0,115200 root=/dev/ram && bootm ${loadaddr}; reset"
#  - autoboot 중 키 입력으로 멈추는 것 금지 (-2 = 지연 없음 + 중단 검사 안 함)
CONFIG_BOOTDELAY=-2
#  - env 를 플래시에서 읽지 않음: 플래시 env 의 bootcmd 를 공격자가 바꾸는 길 차단
CONFIG_ENV_IS_NOWHERE=y
# CONFIG_ENV_IS_IN_FLASH is not set
#  - 심층 방어: 무서명 실행 명령 제거. booti 는 못 뺀다 -- arm64 bootm 이 booti_setup() 을 씀 (boot/bootm.c:676)
# CONFIG_CMD_BOOTZ is not set
# CONFIG_CMD_GO is not set
# CONFIG_CMD_BOOTEFI is not set
