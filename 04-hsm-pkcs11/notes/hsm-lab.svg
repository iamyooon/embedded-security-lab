<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1040" viewBox="0 0 1640 1040">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
<rect width="1640" height="1040" fill="#ffffff"/>
<text x="40" y="50" font-family="NanumGothic, sans-serif" font-size="28" fill="#1d1d1f" font-weight="bold" text-anchor="start">04 HSM (SoftHSM + PKCS#11) -- 키는 못 꺼내게, 서명만 시킨다</text>
<text x="40" y="84" font-family="NanumGothic, sans-serif" font-size="17" fill="#555555" font-weight="normal" text-anchor="start">공격자 = PIN 을 가진 빌드 서버 root.  HSM 이 막는 것 = 키 유출.  못 막는 것 = PIN 으로 서명 시키기(오용).</text>
<rect x="40" y="115" width="1000" height="330" rx="12" fill="#fafafa" stroke="#bbbbbb" stroke-width="2"/>
<text x="60" y="145" font-family="NanumGothic, sans-serif" font-size="18" fill="#1d1d1f" font-weight="bold" text-anchor="start">빌드 서버 -- mkimage / pkcs11-tool 프로세스 (root 가 메모리를 볼 수 있음)</text>
<rect x="70" y="170" width="290" height="120" rx="8" fill="#e8f0fb" stroke="#3b6fb6" stroke-width="2"/>
<text x="84" y="196" font-family="NanumGothic, sans-serif" font-size="17" fill="#3b6fb6" font-weight="bold" text-anchor="start">앱 (mkimage)</text>
<text x="84" y="222" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">키 = 핸들(번호)로만 가리킴</text>
<text x="84" y="244" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">C_Login(PIN) -&gt; C_Sign(핸들, 해시)</text>
<line x1="360" y1="230" x2="430" y2="230" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<rect x="430" y="170" width="580" height="250" rx="8" fill="#fff6e5" stroke="#c98a00" stroke-width="2"/>
<text x="444" y="196" font-family="NanumGothic, sans-serif" font-size="17" fill="#c98a00" font-weight="bold" text-anchor="start">SoftHSM = 같은 프로세스에 로드된 .so</text>
<text x="444" y="222" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">토큰 파일: 키를 PIN 유래 키로 암호화해 디스크 저장</text>
<text x="444" y="244" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">속성 sensitive / never extractable -&gt; API 로는 값 안 줌</text>
<text x="444" y="266" font-family="NanumGothic, sans-serif" font-size="15" fill="#c0392b" font-weight="normal" text-anchor="start">서명 순간: 키를 복호해 이 프로세스 메모리에서 연산</text>
<text x="444" y="288" font-family="NanumGothic, sans-serif" font-size="15" fill="#c0392b" font-weight="normal" text-anchor="start">(OpenSSL RSA_sign 안에 p, q 가 평문으로 있음)</text>
<text x="444" y="310" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">서명 후에는 지움 -&gt; 끝난 뒤 덤프로는 0건</text>
<text x="444" y="332" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start"></text>
<text x="444" y="354" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">진짜 HSM: 연산이 별도 칩 안 -&gt; 호스트 메모리에 키 없음</text>
<rect x="1080" y="115" width="520" height="150" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="2"/>
<text x="1094" y="141" font-family="NanumGothic, sans-serif" font-size="17" fill="#2e8b57" font-weight="bold" text-anchor="start">[H1] API 로 꺼내기 -- 막힘</text>
<text x="1094" y="167" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">C_GetAttributeValue(CKA_PRIVATE_EXPONENT)</text>
<text x="1094" y="189" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">rv=0x11 CKR_ATTRIBUTE_SENSITIVE, 길이 -1</text>
<text x="1094" y="211" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">막은 것: 권한이 아니라 키 속성 (SoftHSM 이 검사)</text>
<text x="1094" y="233" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">= 01 의 EXPORT_KEY 를 OP-TEE 코어가 막은 구조</text>
<rect x="1080" y="285" width="520" height="160" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="1094" y="311" font-family="NanumGothic, sans-serif" font-size="17" fill="#c0392b" font-weight="bold" text-anchor="start">[H2] root 메모리 덤프 -- 뚫림</text>
<text x="1094" y="337" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">RSA_sign 진입 시점 gcore -&gt; n 을 나누는 128B 탐색</text>
<text x="1094" y="359" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">p, q 각 2벌 (SoftHSM BE + OpenSSL BIGNUM LE)</text>
<text x="1094" y="381" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">p*q == n, 복원 키 서명 == HSM 서명</text>
<text x="1094" y="403" font-family="NanumGothic, sans-serif" font-size="15" fill="#c0392b" font-weight="normal" text-anchor="start">SoftHSM 이라서. 진짜 HSM 은 이 경로 없음(미확인)</text>
<line x1="1010" y1="330" x2="1080" y2="360" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ah)"/>
<rect x="40" y="480" width="1560" height="420" rx="12" fill="#fafafa" stroke="#bbbbbb" stroke-width="2"/>
<text x="60" y="510" font-family="NanumGothic, sans-serif" font-size="18" fill="#1d1d1f" font-weight="bold" text-anchor="start">02 FIT 와 연결 -- 서명하는 쪽만 바뀌고, 검증하는 쪽(U-Boot)은 그대로</text>
<rect x="70" y="535" width="330" height="150" rx="8" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
<text x="84" y="561" font-family="NanumGothic, sans-serif" font-size="17" fill="#666666" font-weight="bold" text-anchor="start">02 (이전)</text>
<text x="84" y="587" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">keys/fitdev.key 평문 파일</text>
<text x="84" y="609" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">mkimage -k keys</text>
<text x="84" y="631" font-family="NanumGothic, sans-serif" font-size="15" fill="#c0392b" font-weight="normal" text-anchor="start">파일 복사 = 키 유출</text>
<rect x="70" y="705" width="330" height="170" rx="8" fill="#fff6e5" stroke="#c98a00" stroke-width="2"/>
<text x="84" y="731" font-family="NanumGothic, sans-serif" font-size="17" fill="#c98a00" font-weight="bold" text-anchor="start">04 (지금)</text>
<text x="84" y="757" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">토큰 fit / 키 fithsm</text>
<text x="84" y="779" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">mkimage -N pkcs11</text>
<text x="84" y="801" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">  -k pkcs11:token=fit;pin-value=..</text>
<text x="84" y="823" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">개인키 파일 없음</text>
<text x="84" y="845" font-family="NanumGothic, sans-serif" font-size="15" fill="#c0392b" font-weight="normal" text-anchor="start">PIN 이 명령줄 -&gt; ps 로 보임</text>
<line x1="400" y1="790" x2="470" y2="700" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<rect x="470" y="600" width="340" height="200" rx="8" fill="#e8f0fb" stroke="#3b6fb6" stroke-width="2"/>
<text x="484" y="626" font-family="NanumGothic, sans-serif" font-size="17" fill="#3b6fb6" font-weight="bold" text-anchor="start">산출물</text>
<text x="484" y="652" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">kernel-hsm.itb</text>
<text x="484" y="674" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">  conf-1 서명 sha256,rsa2048:fithsm</text>
<text x="484" y="696" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">ctrl-hsm.dtb</text>
<text x="484" y="718" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">  /signature/key-fithsm (required)</text>
<text x="484" y="740" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">u-boot-nodtb.bin + ctrl-hsm.dtb</text>
<text x="484" y="762" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">  = BL33 -&gt; TF-A 가 해시로 덮음</text>
<line x1="810" y1="650" x2="880" y2="600" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<line x1="810" y1="750" x2="880" y2="770" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<rect x="880" y="535" width="690" height="150" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="2"/>
<text x="894" y="561" font-family="NanumGothic, sans-serif" font-size="16" fill="#2e8b57" font-weight="bold" text-anchor="start">[F1] 새 U-Boot(key-fithsm) + HSM 서명 itb -- 예측: 동작, 맞음</text>
<text x="894" y="587" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">sha256,rsa2048:fithsm+ OK  -&gt;  이미지 해시 sha256+ OK</text>
<text x="894" y="609" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">-&gt; 커널 -&gt; login, uname 출력</text>
<text x="894" y="631" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">오프라인 fit_check_sign -k ctrl-hsm.dtb : Signature check OK</text>
<rect x="880" y="705" width="690" height="170" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="894" y="731" font-family="NanumGothic, sans-serif" font-size="16" fill="#c0392b" font-weight="bold" text-anchor="start">[F2] 02 U-Boot(key-fitdev) + HSM 서명 itb -- 예측: 안 됨, 맞음</text>
<text x="894" y="757" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">sha256,rsa2048:fithsm-  error!</text>
<text x="894" y="779" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">Failed to verify required signature 'key-fitdev'</text>
<text x="894" y="801" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">-&gt; resetting ... 반복 (02 하드닝: 실패 시 셸 대신 리셋)</text>
<text x="894" y="823" font-family="NanumGothic, sans-serif" font-size="15" fill="#1d1d1f" font-weight="normal" text-anchor="start">U-Boot 는 서명이 파일로 됐는지 HSM 으로 됐는지 모름 -&gt; 공개키만 맞으면 됨</text>
<text x="40" y="945" font-family="NanumGothic, sans-serif" font-size="17" fill="#1d1d1f" font-weight="bold" text-anchor="start">결론: HSM 은 검증 체인과 별개로, 체인이 기대는 전제(개인키 비밀성)를 지킨다. 키 유출은 HSM 이, 키 오용은 PIN 관리 / 승인 절차 / 로그가 막는다.</text>
<text x="40" y="980" font-family="NanumGothic, sans-serif" font-size="15" fill="#555555" font-weight="normal" text-anchor="start">근거: 04-hsm-pkcs11/src/{read_priv.c, h2_dump.sh, h2_recover.py}, fit/build-fit-hsm.sh, u-boot lib/rsa/rsa-sign.c (pkcs11 URI), README 실험 표</text>
</svg>