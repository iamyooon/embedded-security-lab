<text x="1132" y="894" font-family="NanumGothic, sans-serif" font-size="16" fill="#c98a00" font-weight="bold" text-anchor="start">OP-TEE OS</text>
<text x="1132" y="918" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">thread_handle_std_smc</text>
<text x="1132" y="939" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">   (thread_optee_smc.c:52)</text>
<text x="1132" y="960" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start"> -&gt; entry_invoke_command (entry_std.c:429)</text>
<text x="1132" y="981" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start"> -&gt; TA 세션 찾아 S-EL0 로 진입</text>
<text x="1132" y="1002" font-family="NanumGothicCoding, monospace" font-size="14" fill="#555555" font-weight="normal" text-anchor="start">memref = (b) 에서 받은 물리 페이지를 매핑</text>
<text x="1132" y="1023" font-family="NanumGothicCoding, monospace" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="start">파일 필요 -&gt; thread_rpc_cmd (tee_fs_rpc.c:45)</text>
<text x="1132" y="1044" font-family="NanumGothicCoding, monospace" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="start">  -&gt; RPC 로 반환 (암호화/해시는 여기서 끝냄)</text>
<line x1="1355" y1="820" x2="1355" y2="870" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<rect x="560" y="870" width="500" height="170" rx="8" fill="#fff6e5" stroke="#c98a00" stroke-width="2"/>
<text x="572" y="894" font-family="NanumGothic, sans-serif" font-size="16" fill="#c98a00" font-weight="bold" text-anchor="start">secure_mac TA (S-EL0)</text>
<text x="572" y="918" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">TA_InvokeCommandEntryPoint</text>
<text x="572" y="939" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start"> -&gt; check_owner(TEE_Identity == 주인?)</text>
<text x="572" y="960" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start"> -&gt; mac_do(키 id, msg) -&gt; tag</text>
<text x="572" y="981" font-family="NanumGothicCoding, monospace" font-size="14" fill="#c0392b" font-weight="normal" text-anchor="start">msg 는 normal 메모리: 검사 중 CA 가 바꿀 수 있음</text>
<text x="572" y="1002" font-family="NanumGothicCoding, monospace" font-size="14" fill="#555555" font-weight="normal" text-anchor="start">-&gt; 복사한 뒤 검사하고 사용 (TOCTOU)</text>
<line x1="1120" y1="955" x2="1060" y2="955" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<rect x="40" y="915" width="480" height="170" rx="8" fill="#e7f5ec" stroke="#2e8b57" stroke-width="2"/>
<text x="52" y="939" font-family="NanumGothic, sans-serif" font-size="16" fill="#2e8b57" font-weight="bold" text-anchor="start">이 경로에서 나온 01 결론</text>
<text x="52" y="963" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">A6: 신원의 원천이 normal 커널의 euid</text>
<text x="52" y="984" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">    -&gt; TEE 혼자 root 를 못 막음</text>
<text x="52" y="1005" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">공유 메모리: pin 은 위치만 고정,</text>
<text x="52" y="1026" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">    내용 변경은 못 막음 -&gt; TA 가 복사</text>
<text x="52" y="1047" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">S1-S3: 저장 I/O 는 (c) RPC 로 tee-supplicant 가</text>
<text x="52" y="1068" font-family="NanumGothic, sans-serif" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">    대행 -&gt; 암호문만 다룸, 롤백은 root 손안</text>
