<text x="672" y="429" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start"> -&gt; iov_iter_extract_pages()   :451</text>
<text x="672" y="450" font-family="NanumGothicCoding, monospace" font-size="14" fill="#555555" font-weight="normal" text-anchor="start">   페이지 pin: 이동/해제 금지</text>
<text x="672" y="471" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start"> -&gt; optee_shm_register (smc_abi.c:453)</text>
<text x="672" y="492" font-family="NanumGothicCoding, monospace" font-size="14" fill="#555555" font-weight="normal" text-anchor="start">   물리 페이지 목록 -&gt; OP-TEE</text>
<line x1="620" y1="425" x2="660" y2="425" stroke="#777777" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1120" y="360" width="470" height="215" rx="8" fill="#eef3fb" stroke="#24508f" stroke-width="2"/>
<text x="1132" y="384" font-family="NanumGothic, sans-serif" font-size="16" fill="#24508f" font-weight="bold" text-anchor="start">(c) SMC 루프  smc_abi.c</text>
<text x="1132" y="408" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">optee_invoke_func (call.c:512)</text>
<text x="1132" y="429" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start"> -&gt; optee_smc_do_call_with_arg   :886</text>
<text x="1132" y="450" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">    a0 = OPTEE_SMC_CALL_WITH_(REGD_)ARG</text>
<text x="1132" y="471" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">    while: invoke_fn = arm_smccc_smc :1474</text>
<text x="1132" y="492" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">      RPC 반환 -&gt; optee_handle_rpc  :951</text>
<text x="1132" y="513" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">        -&gt; handle_rpc_supp_cmd (rpc.c:187)</text>
<text x="1132" y="534" font-family="NanumGothicCoding, monospace" font-size="14" fill="#555555" font-weight="normal" text-anchor="start">       tee-supplicant 처리 후 다시 SMC</text>
<text x="1132" y="555" font-family="NanumGothicCoding, monospace" font-size="14" fill="#1d1d1f" font-weight="normal" text-anchor="start">      아니면 결과 반환</text>
